name: Meaningful Move Probability Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'forecast/train_meaningful_move_probability.py'
      - '.github/workflows/meaningful-probability.yml'
      - 'requirements.txt'

permissions:
  contents: write

concurrency:
  group: phase1-meaningful-probability
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/cache@v4
        with:
          path: forecast/.cache_history
          key: phase1-15m-history-v2-${{ runner.os }}
      - run: pip install -r requirements.txt
      - name: Train meaningful upside neutral downside probabilities
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          PHASE1_PROB_START: '2021-01-01'
        run: python forecast/train_meaningful_move_probability.py
      - name: Commit research validation artifacts
        run: |
          test -f forecast/data/meaningful_move_probability.joblib
          test -f docs/data/meaningful_probability_validation.json
          git config user.name "phase1-bot"
          git config user.email "actions@users.noreply.github.com"
          git add forecast/data/meaningful_move_probability.joblib docs/data/meaningful_probability_validation.json
          git diff --cached --quiet && exit 0
          git commit -m "data: meaningful move probability validation"
          git pull --rebase
          git push
