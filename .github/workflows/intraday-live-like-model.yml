name: Intraday Selective Meta Model V5

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase1-intraday-history-v4
  cancel-in-progress: false

jobs:
  collect-history:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - batch: b0
            symbols: 'AAPL,MSFT,NVDA,AMZN,META,GOOGL,GOOG,TSLA,SPY'
          - batch: b1
            symbols: 'AMD,AVGO,NFLX,JPM,BAC,XOM,CVX,WMT'
          - batch: b2
            symbols: 'COST,HD,UNH,LLY,ORCL,CRM,PLTR,MU'
          - batch: b3
            symbols: 'INTC,QCOM,AMAT,TSM,UBER,V,MA,GS'
          - batch: b4
            symbols: 'MS,CAT,GE,DIS,KO,PEP,CSCO,ADBE'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore this batch's historical 15m cache
        uses: actions/cache@v4
        with:
          path: forecast/cache/intraday15
          key: phase1-intraday15-v4-${{ matrix.batch }}-${{ github.run_id }}
          restore-keys: |
            phase1-intraday15-v4-${{ matrix.batch }}-
      - name: Collect or refresh multi-year 15m history
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          PHASE1_INTRADAY_START: '2020-01-01'
          PHASE1_TWELVE_RPM: '1'
          PHASE1_BATCH_SYMBOLS: ${{ matrix.symbols }}
        run: python forecast/collect_intraday_cache_batch.py
      - uses: actions/upload-artifact@v4
        with:
          name: intraday-cache-${{ matrix.batch }}
          path: forecast/cache/intraday15/*.csv.gz
          if-no-files-found: error
          retention-days: 7

  build-train-freeze:
    needs: collect-history
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: intraday-cache-*
          path: forecast/cache/intraday15
          merge-multiple: true
      - name: Verify complete 40-stock plus SPY cache
        run: |
          python - <<'PY'
          from pathlib import Path
          expected=set('AAPL MSFT NVDA AMZN META GOOGL GOOG TSLA AMD AVGO NFLX JPM BAC XOM CVX WMT COST HD UNH LLY ORCL CRM PLTR MU INTC QCOM AMAT TSM UBER V MA GS MS CAT GE DIS KO PEP CSCO ADBE SPY'.split())
          found={p.stem.replace('.csv','') for p in Path('forecast/cache/intraday15').glob('*.csv.gz')}
          missing=sorted(expected-found); print('cache files:',len(found),'missing:',missing)
          if missing: raise SystemExit('missing required history: '+','.join(missing))
          PY
      - name: Build historical live-like snapshots
        env:
          PHASE1_INTRADAY_START: '2020-01-01'
          PHASE1_INTRADAY_SYMBOLS: '40'
        run: python forecast/build_intraday_from_cache_v4.py
      - name: Align stock and SPY labels
        run: python forecast/correct_intraday_labels.py
      - name: Audit dataset integrity
        run: python forecast/audit_intraday_dataset.py
      - name: Train selective regime-aware meta model V5
        run: python forecast/train_intraday_meta_model_v5.py
      - name: Commit frozen model and evidence
        run: |
          git config user.name "phase1-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/intraday_training_summary.json docs/data/intraday_dataset_audit.json docs/data/intraday_model_v3_validation.json forecast/data/intraday_signal_v3.joblib
          if [ -f forecast/data/intraday_live_like_v2.csv.gz ]; then
            SIZE=$(stat -c%s forecast/data/intraday_live_like_v2.csv.gz)
            if [ "$SIZE" -lt 90000000 ]; then git add forecast/data/intraday_live_like_v2.csv.gz; fi
          fi
          git diff --cached --quiet && exit 0
          git commit -m "data: freeze selective intraday meta model v5"
          git pull --rebase
          git push
