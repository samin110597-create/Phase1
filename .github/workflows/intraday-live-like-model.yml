name: Intraday Live-Like Probability Model V3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'forecast/build_intraday_live_like_dataset.py'
      - 'forecast/train_intraday_live_like_model.py'
      - '.github/workflows/intraday-live-like-model.yml'
  schedule:
    - cron: '20 3 * * 0'

permissions:
  contents: write

concurrency:
  group: phase1-intraday-history-v3
  cancel-in-progress: false

jobs:
  build-train-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restore historical 15m cache
        uses: actions/cache@v4
        with:
          path: forecast/cache/intraday15
          key: phase1-intraday15-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            phase1-intraday15-v2-${{ runner.os }}-

      - name: Build historical snapshots that mirror the live engine
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          PHASE1_INTRADAY_START: '2020-01-01'
          PHASE1_INTRADAY_SYMBOLS: '40'
          PHASE1_TWELVE_RPM: '7'
        run: python forecast/build_intraday_live_like_dataset.py

      - name: Train calibrated selective model and freeze for forward validation
        run: python forecast/train_intraday_live_like_model.py

      - name: Commit sanitized model evidence
        run: |
          git config user.name "phase1-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/intraday_training_summary.json docs/data/intraday_model_v3_validation.json forecast/data/intraday_signal_v3.joblib
          if [ -f forecast/data/intraday_live_like_v2.csv.gz ]; then
            SIZE=$(stat -c%s forecast/data/intraday_live_like_v2.csv.gz)
            if [ "$SIZE" -lt 90000000 ]; then
              git add forecast/data/intraday_live_like_v2.csv.gz
            else
              echo "Derived dataset is $SIZE bytes; keeping it in the Actions workspace/cache rather than pushing a >90MB repo file."
            fi
          fi
          git diff --cached --quiet && exit 0
          git commit -m "data: freeze live-like intraday probability model v3"
          git pull --rebase
          git push
