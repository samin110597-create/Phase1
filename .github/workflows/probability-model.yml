name: Calibrated Forecast Probabilities

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'forecast/train_live_probability.py'
      - 'forecast/live_probability_inference.py'
      - 'scripts/github_live_forecast_v2.py'
      - 'requirements.txt'
      - '.github/workflows/probability-model.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: phase1-probability-training
  cancel-in-progress: false

jobs:
  train-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Train and calibrate 1 / 5 / 10-session probability models
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          PHASE1_PROB_START: '2021-01-01'
        run: python forecast/train_live_probability.py
      - name: Generate live snapshot using newly trained model
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/github_live_forecast_v2.py
      - name: Commit model, validation, and live probability snapshot
        run: |
          test -f forecast/data/live_probability_model.joblib
          test -f docs/data/probability_validation.json
          test -f docs/data/live_forecast.json
          git config user.name "phase1-bot"
          git config user.email "actions@users.noreply.github.com"
          git add forecast/data/live_probability_model.joblib docs/data/probability_validation.json docs/data/live_forecast.json
          git diff --cached --quiet && exit 0
          git commit -m "data: publish calibrated Forecast V1 probabilities"
          git pull --rebase
          git push

  deploy-pages:
    needs: train-validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Deploy calibrated probability dashboard data
        id: deployment
        uses: actions/deploy-pages@v4
