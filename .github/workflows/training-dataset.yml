name: Forecast V1 Pilot Training Dataset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'forecast/build_training_dataset.py'
      - '.github/workflows/training-dataset.yml'

permissions:
  contents: write

concurrency:
  group: phase1-training-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build point-in-time pilot training dataset
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          PHASE1_TRAIN_START: '2020-01-01'
          PHASE1_TRAIN_SYMBOLS: '12'
        run: python forecast/build_training_dataset.py
      - name: Commit sanitized training summary and compressed dataset
        run: |
          git config user.name "phase1-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/training_summary.json forecast/data/training_v1.csv.gz
          git diff --cached --quiet && exit 0
          git commit -m "data: build Forecast V1 pilot training dataset"
          git pull --rebase
          git push
