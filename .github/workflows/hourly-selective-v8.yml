name: Hourly Selective Side Model V8

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase1-hourly-selective-v8
  cancel-in-progress: true

jobs:
  train-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Train V8 selective side models in staging
        shell: bash
        run: |
          set +e
          python -m forecast.run_hourly_selective_v8 > /tmp/v8.log 2>&1
          code=$?
          tail -c 15000 /tmp/v8.log > /tmp/v8_tail.log || true
          TRAIN_EXIT=$code python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          log=Path('/tmp/v8_tail.log').read_text(errors='replace') if Path('/tmp/v8_tail.log').exists() else ''
          code=int(os.environ.get('TRAIN_EXIT','999'))
          Path('docs/data/hourly_selective_v8_build_status.json').write_text(json.dumps({'generated_at':datetime.now(timezone.utc).isoformat(),'status':'SUCCESS' if code==0 else 'FAILED','exit_code':code,'stage_model_exists':Path('forecast/data/hourly_selective_v8.joblib').exists(),'validation_exists':Path('docs/data/hourly_selective_v8_validation.json').exists(),'status_file_exists':Path('docs/data/hourly_selective_v8_status.json').exists(),'log_tail':log[-15000:]},separators=(',',':')))
          PY
          exit 0
      - name: Commit V8 staging evidence
        run: |
          git config user.name "phase1-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/hourly_selective_v8_build_status.json
          test ! -f forecast/data/hourly_selective_v8.joblib || git add forecast/data/hourly_selective_v8.joblib
          test ! -f docs/data/hourly_selective_v8_validation.json || git add docs/data/hourly_selective_v8_validation.json
          test ! -f docs/data/hourly_selective_v8_status.json || git add docs/data/hourly_selective_v8_status.json
          git diff --cached --quiet && exit 0
          git commit -m "data: record selective hourly model v8 evidence"
          git pull --rebase
          git push
