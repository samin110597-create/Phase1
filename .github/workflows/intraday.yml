name: Phase1 — Q-State challenger lab

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'requirements.txt'
      - 'docs/index.html'
      - 'scripts/qstate_client.py'
      - '.github/workflows/intraday.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: phase1-challenger-lab
  cancel-in-progress: true

jobs:
  validate-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify research runtime and shared Q-State source
        env:
          QSTATE_API_BASE: https://stock-truth-v2.samin110597.deno.net
        run: |
          python -m py_compile scripts/qstate_client.py forecast/live_intraday_v3_inference.py
          python scripts/qstate_client.py AAPL --timeframe 1D --smoke

  deploy-redirect:
    needs: validate-lab
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Deploy canonical-model redirect
        id: deployment
        uses: actions/deploy-pages@v4
