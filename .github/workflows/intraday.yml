name: GitHub-Only Live Forecast

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/github_live_forecast*.py'
      - 'forecast/live_probability_inference.py'
      - 'forecast/live_intraday_v3_inference.py'
      - 'forecast/update_forward_validation*.py'
      - 'forecast/data/live_probability_model.joblib'
      - 'forecast/data/intraday_signal_v3.joblib'
      - 'docs/data/intraday_model_v3_validation.json'
      - '.github/workflows/intraday.yml'
  schedule:
    - cron: '30-59/5 9 * * 1-5'
      timezone: 'America/New_York'
    - cron: '*/5 10-15 * * 1-5'
      timezone: 'America/New_York'
    - cron: '0 16 * * 1-5'
      timezone: 'America/New_York'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: phase1-live-forecast
  cancel-in-progress: true

jobs:
  live-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build evidence-gated live forecast with numeric targets
        shell: bash
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          set +e
          python scripts/github_live_forecast_v10.py > /tmp/live.log 2>&1
          code=$?
          tail -c 12000 /tmp/live.log > /tmp/live_tail.log || true
          LIVE_EXIT=$code python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          code=int(os.environ.get('LIVE_EXIT','999'))
          log=Path('/tmp/live_tail.log').read_text(errors='replace') if Path('/tmp/live_tail.log').exists() else ''
          Path('docs/data/live_build_status.json').write_text(json.dumps({
              'generated_at':datetime.now(timezone.utc).isoformat(),
              'status':'SUCCESS' if code==0 and Path('docs/data/live_forecast.json').exists() else 'FAILED',
              'exit_code':code,
              'live_forecast_exists':Path('docs/data/live_forecast.json').exists(),
              'log_tail':log[-12000:]},separators=(',',':')))
          PY
          exit 0
      - name: Recover stored fixed-time forecasts and update forward validation
        shell: bash
        run: |
          set +e
          python forecast/update_forward_validation_v2.py
          exit 0
      - name: Commit live forecast, build status and forward evidence
        run: |
          test -f docs/data/live_forecast.json
          git config user.name "phase1-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/live_forecast.json docs/data/live_build_status.json
          test ! -f docs/data/forward_validation.json || git add docs/data/forward_validation.json
          test ! -f docs/data/forward_predictions.json || git add docs/data/forward_predictions.json
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh evidence-gated live forecast"
          git pull --rebase
          git push

  deploy-pages:
    needs: live-forecast
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Deploy latest live snapshot to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
