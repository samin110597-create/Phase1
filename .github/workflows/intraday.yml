name: GitHub-Only Live Forecast

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/github_live_forecast.py'
      - '.github/workflows/intraday.yml'
  schedule:
    - cron: '30-59/5 9 * * 1-5'
      timezone: 'America/New_York'
    - cron: '*/5 10-15 * * 1-5'
      timezone: 'America/New_York'
    - cron: '0 16 * * 1-5'
      timezone: 'America/New_York'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: phase1-live-forecast
  cancel-in-progress: true

jobs:
  live-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build GitHub-only near-live forecast snapshot
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/github_live_forecast.py
      - name: Commit live forecast snapshot
        run: |
          test -f docs/data/live_forecast.json
          git config user.name "phase1-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/live_forecast.json
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh GitHub-only live forecast"
          git pull --rebase
          git push

  deploy-pages:
    needs: live-forecast
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Deploy latest live snapshot to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
