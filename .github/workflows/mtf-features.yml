name: Forecast V1 Multi-Timeframe Features

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'forecast/build_mtf_features.py'
      - '.github/workflows/mtf-features.yml'
  schedule:
    - cron: '*/15 10-15 * * 1-5'
      timezone: 'America/New_York'
    - cron: '30,45 9 * * 1-5'
      timezone: 'America/New_York'
    - cron: '0 16 * * 1-5'
      timezone: 'America/New_York'

permissions:
  contents: write

concurrency:
  group: phase1-data-writes
  cancel-in-progress: false

jobs:
  features:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build neutral multi-timeframe research features
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          PHASE1_MTF_SYMBOLS: '40'
        run: python forecast/build_mtf_features.py
      - name: Commit sanitized feature dataset
        run: |
          git config user.name "phase1-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/mtf_features.json
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh Forecast V1 multi-timeframe features"
          git pull --rebase
          git push
