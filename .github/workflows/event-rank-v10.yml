name: SEC Event Rank Consensus Model V10

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/event-rank-v10.yml'
      - 'forecast/sec_event_features.py'
      - 'forecast/train_event_augmented_v10.py'
      - 'forecast/RUN_EVENT_RANK_V10'

permissions:
  contents: write

concurrency:
  group: phase1-event-rank-v10
  cancel-in-progress: true

jobs:
  train-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Train SEC-event augmented V10 staging model
        shell: bash
        run: |
          set +e
          python -m forecast.train_event_augmented_v10 > /tmp/v10.log 2>&1
          code=$?
          tail -c 20000 /tmp/v10.log > /tmp/v10_tail.log || true
          TRAIN_EXIT=$code python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          log=Path('/tmp/v10_tail.log').read_text(errors='replace') if Path('/tmp/v10_tail.log').exists() else ''
          code=int(os.environ.get('TRAIN_EXIT','999'))
          Path('docs/data/event_rank_consensus_v10_build_status.json').write_text(json.dumps({
              'generated_at':datetime.now(timezone.utc).isoformat(),
              'status':'SUCCESS' if code==0 else 'FAILED',
              'exit_code':code,
              'stage_model_exists':Path('forecast/data/event_rank_consensus_v10.joblib').exists(),
              'validation_exists':Path('docs/data/event_rank_consensus_v10_validation.json').exists(),
              'log_tail':log[-20000:]},separators=(',',':')))
          PY
          exit 0
      - name: Commit V10 staging evidence
        run: |
          git config user.name "phase1-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/event_rank_consensus_v10_build_status.json
          test ! -f forecast/data/event_rank_consensus_v10.joblib || git add forecast/data/event_rank_consensus_v10.joblib
          test ! -f docs/data/event_rank_consensus_v10_validation.json || git add docs/data/event_rank_consensus_v10_validation.json
          test ! -f docs/data/event_rank_consensus_v10_status.json || git add docs/data/event_rank_consensus_v10_status.json
          git diff --cached --quiet && exit 0
          git commit -m "data: record SEC-event rank model v10 evidence"
          git pull --rebase
          git push
