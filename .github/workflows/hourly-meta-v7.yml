name: Bulk-Hourly Selective Meta Model V7

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'forecast/RUN_HOURLY_META_V7'

permissions:
  contents: write

concurrency:
  group: phase1-hourly-meta-v7
  cancel-in-progress: true

jobs:
  train-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Train rate-limit-independent hourly meta model
        run: python forecast/train_hourly_meta_model_v7.py
      - name: Commit frozen model and validation evidence
        run: |
          test -f forecast/data/intraday_signal_v3.joblib
          test -f docs/data/intraday_model_v3_validation.json
          test -f docs/data/intraday_training_summary.json
          test -f docs/data/intraday_dataset_audit.json
          git config user.name "phase1-bot"
          git config user.email "actions@users.noreply.github.com"
          git add forecast/data/intraday_signal_v3.joblib docs/data/intraday_model_v3_validation.json docs/data/intraday_training_summary.json docs/data/intraday_dataset_audit.json
          git diff --cached --quiet && exit 0
          git commit -m "data: freeze bulk-hourly selective meta model v7"
          git pull --rebase
          git push
