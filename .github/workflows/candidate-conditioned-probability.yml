name: Candidate Conditioned Probability Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'forecast/train_candidate_conditioned_probability.py'
      - '.github/workflows/candidate-conditioned-probability.yml'
      - 'requirements.txt'

permissions:
  contents: write

concurrency:
  group: phase1-candidate-conditioned-probability
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Train broad candidate-conditioned probabilities
        run: python forecast/train_candidate_conditioned_probability.py
      - name: Commit validation artifacts
        run: |
          test -f forecast/data/candidate_conditioned_probability.joblib
          test -f docs/data/candidate_conditioned_validation.json
          git config user.name "phase1-bot"
          git config user.email "actions@users.noreply.github.com"
          git add forecast/data/candidate_conditioned_probability.joblib docs/data/candidate_conditioned_validation.json
          git diff --cached --quiet && exit 0
          git commit -m "data: candidate-conditioned probability validation"
          git pull --rebase
          git push
