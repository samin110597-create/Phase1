name: Forecast V1 History Coverage Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'forecast/probe_intraday_history.py'
      - '.github/workflows/history-probe.yml'

permissions:
  contents: write

concurrency:
  group: phase1-data-writes
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe historical intraday entitlements
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python forecast/probe_intraday_history.py
      - name: Commit sanitized coverage report
        run: |
          git config user.name "phase1-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/history_probe.json
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh Forecast V1 history coverage probe"
          git pull --rebase
          git push
