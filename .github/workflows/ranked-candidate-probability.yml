name: Ranked Candidate Probability Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'forecast/train_ranked_candidate_probability.py'
      - 'forecast/train_candidate_conditioned_probability.py'
      - 'forecast/__init__.py'
      - '.github/workflows/ranked-candidate-probability.yml'
      - 'requirements.txt'

permissions:
  contents: write

concurrency:
  group: phase1-ranked-candidate-probability
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Train learned top-10 candidate selector
        run: python -m forecast.train_ranked_candidate_probability
      - name: Commit validation artifacts
        run: |
          test -f forecast/data/ranked_candidate_probability.joblib
          test -f docs/data/ranked_candidate_validation.json
          git config user.name "phase1-bot"
          git config user.email "actions@users.noreply.github.com"
          git add forecast/data/ranked_candidate_probability.joblib docs/data/ranked_candidate_validation.json
          git diff --cached --quiet && exit 0
          git commit -m "data: ranked candidate probability validation"
          git pull --rebase
          git push
